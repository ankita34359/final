openapi: 3.0.0
info:
  title: DKT JEE Inference API
  version: "1.0"
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /predict:
    post:
      summary: Score a single candidate question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                history_qids:
                  type: array
                  items: { type: string }
                history_correct:
                  type: array
                  items: { type: integer }
                candidate_qid:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
  /recommend:
    post:
      summary: Recommend top-k next questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                history_qids:
                  type: array; items: { type: string }
                history_correct:
                  type: array; items: { type: integer }
                k: { type: integer }
      responses:
        '200':
          description: Recommendations